[project]
name = "pokedex-tui"
version = "0.1.0"
description = "A terminal app for browsing Pokemon stats, with search and filters by name, type and generation. Built with Python and Textual, reading an offline CSV bundled with the app"
readme = "README.md"
authors = [
    { name = "Utsav Deep", email = "utsavdeep01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pokedex-tui = "pokedex_tui.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "textual-dev>=1.8.0",
    "pytest-asyncio>=1.4.0",
    "pyright[nodejs]>=1.1.414",
    "pytest-xdist>=3.8.0",
]

[tool.pytest]
testpaths = [
	"tests"
]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"


# Release config used by the Jenkins "Release" stage on main.
# Version is derived from conventional commits since the last v* tag:
# feat -> minor, fix/perf -> patch, "!" or "BREAKING CHANGE" -> major.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
# Re-lock so uv.lock carries the new project version, then build wheel + sdist.
build_command = "uv lock --upgrade-package pokedex-tui && uv build"
# Extra files staged into the release commit alongside pyproject.toml.
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"
# Pushes over HTTPS with the token in GH_TOKEN (Jenkins credential GITHUB_PAT).
token = { env = "GH_TOKEN" }
