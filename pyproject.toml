[project]
name = "pokedex-tui"
version = "0.1.0"
description = "A terminal app for browsing Pokemon stats, with search and filters by name, type and generation. Built with Python and Textual, reading an offline CSV bundled with the app"
readme = "README.md"
authors = [
    { name = "Utsav Deep", email = "utsavdeep01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pokedex-tui = "pokedex_tui.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "textual-dev>=1.8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest]
testpaths = [
	"tests/test_smoke.py",
	"tests/test_models.py"
]
asyncio_mode = "auto"

